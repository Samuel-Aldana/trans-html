<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransiKids - Ruta</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body class="pagina-ruta">
    <header class="cabecera-ruta">
      <h1 id="titulo-ruta">Ruta de Mateo Perez</h1>
    </header>

    <main class="contenedor-ruta">
      <img class="imagen-mapa-ruta" src="img/ruta.jpg" alt="Mapa de la ruta">

      <section class="selector-rutas" id="selector-rutas"></section>

      <button class="boton-recentrar-ruta" type="button" aria-label="Recentrar mapa">
        <i class="fa-solid fa-crosshairs"></i>
      </button>

      <section class="tarjeta-info-ruta">
        <div class="cabecera-tarjeta-ruta">
          <div class="estado-ruta">
            <span></span>
            <strong id="estado-ruta-detalle">Ruta en curso</strong>
          </div>
          <p>Avance: <strong id="avance-ruta">10%</strong></p>
        </div>

        <h2 id="estudiante-ruta">Mateo Perez</h2>
        <p class="colegio-ruta">
          <i class="fa-solid fa-graduation-cap"></i>
          <span id="colegio-ruta">Inem</span>
        </p>

        <div class="tiempos-ruta">
          <div>
            <span>Tiempo restante</span>
            <strong class="tiempo-restante-ruta">01:10</strong>
          </div>
          <div>
            <span>Llegada aprox.</span>
            <strong id="llegada-ruta">07:17 AM</strong>
          </div>
        </div>

        <button class="boton-detalles-ruta" type="button">Ver detalles</button>
      </section>
    </main>

    <nav class="barra-navegacion">
      <a class="item-navegacion" href="inicio.html"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
      <a class="item-navegacion activo" href="ruta.html"><i class="fa-solid fa-location-dot"></i><span>Ruta</span></a>
      <a class="item-navegacion" href="hijos.html"><i class="fa-regular fa-face-smile"></i><span>Hijos</span></a>
      <a class="item-navegacion" href="perfil.html"><i class="fa-regular fa-user"></i><span>Perfil</span></a>
    </nav>

    <a class="boton-chat-flotante" href="chat.html" aria-label="Abrir chat">
      <i class="fa-solid fa-robot"></i>
    </a>

    <script src="js/datos.js"></script>
    <script src="js/funciones.js"></script>
  </body>
</html>
